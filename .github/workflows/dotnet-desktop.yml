
name: Build RPG

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore NuGet packages
        run: dotnet restore ./rpg-c/rpg.csproj --force

      - name: Build RPG
        run: dotnet build ./rpg-c/rpg.csproj --configuration Release --no-restore
